trigger:
  - main

pr:
  - main

jobs:
- job: DockerBuildRun
  pool:
    name: Default
  steps:
  - checkout: self
  
  - script: docker stop screen || true
    displayName: Stop Docker container

  - script: docker rm screen || true
    displayName: Remove Docker container

  # - script: docker system prune -a -f
  #   displayName: Prune Docker system

  - script: killall chromium-browser || true
    displayName: Kill Chromium process

  - script: docker build -t screen -f screen/Dockerfile .
    displayName: Docker Build

  - script: docker run -d --name screen -p 3000:3000 screen
    displayName: Docker Run

  - script: chromium-browser --kiosk http://localhost:3000 &
    displayName: Open Chromium browser
